# On the simulator the Dexcom credentials come from secrets.yaml (on the board, from its local web page).
substitutions:
  dexcom_username: !secret dexcom_username
  dexcom_password: !secret dexcom_password
  display_mode: Kids   # Classic or Kids (after changing it: make sim-reset)

esphome:
  name: glucia-sim-dexcom

packages:
  hardware: !include hardware/simulator.yaml
  ui: !include common/ui.yaml
  lang: !include common/lang/en.yaml   # or es.yaml
  data: !include common/dexcom.yaml
