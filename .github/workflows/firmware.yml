# Compila guition.yaml y crea un Release con el firmware, de donde la placa se lo
# descarga sola (update: en hardware/guition.yaml).
#
# Se lanza al subir una etiqueta: git tag v1.2 && git push origin v1.2
# La etiqueta es la versión: la placa se actualiza cuando la publicada es distinta de la suya.
#
# Secretos del repo (Settings > Secrets and variables > Actions):
#   AP_PASSWORD, OTA_PASSWORD: los mismos que en secrets.yaml
name: Firmware

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar ESPHome
        run: pip install esphome==2026.9.1

      - name: Crear secrets.yaml
        env:
          AP_PASSWORD: ${{ secrets.AP_PASSWORD }}
          OTA_PASSWORD: ${{ secrets.OTA_PASSWORD }}
        run: |
          test -n "$AP_PASSWORD" && test -n "$OTA_PASSWORD"
          python - <<'PY'
          import json, os
          with open("secrets.yaml", "w") as f:
              # Las credenciales de Dexcom no van en la placa; solo hacen falta para validar.
              f.write('dexcom_usuario: ""\ndexcom_password: ""\n')
              f.write(f'ap_password: {json.dumps(os.environ["AP_PASSWORD"])}\n')
              f.write(f'ota_password: {json.dumps(os.environ["OTA_PASSWORD"])}\n')
          PY

      - name: Compilar
        run: esphome -s version "${GITHUB_REF_NAME}" compile guition.yaml

      - name: Preparar binarios y manifiesto
        run: |
          mkdir -p publicar
          cp .esphome/build/glucia/build/firmware.ota.bin publicar/glucia.ota.bin
          cp .esphome/build/glucia/build/firmware.factory.bin publicar/glucia.factory.bin
          MD5=$(md5sum publicar/glucia.ota.bin | cut -d' ' -f1)
          # Rutas absolutas a esta versión: el manifiesto se pide por "latest", el binario no.
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > publicar/manifest.json <<JSON
          {
            "name": "Glucía",
            "version": "${GITHUB_REF_NAME}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [{ "path": "${URL}/glucia.factory.bin", "offset": 0 }],
                "ota": {
                  "path": "${URL}/glucia.ota.bin",
                  "md5": "${MD5}",
                  "summary": "Versión ${GITHUB_REF_NAME}"
                }
              }
            ]
          }
          JSON
          cat publicar/manifest.json

      - name: Crear el Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" publicar/* --title "${GITHUB_REF_NAME}" --notes "Firmware ${GITHUB_REF_NAME}"
