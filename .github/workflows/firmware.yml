# Builds guition.yaml and creates a Release with the firmware, which the board
# downloads on its own (update: in hardware/guition.yaml).
#
# Triggered by pushing a tag: git tag v1.2 && git push origin v1.2
# The tag is the version: the board updates when the published one differs from its own.
#
# Repo secrets (Settings > Secrets and variables > Actions):
#   AP_PASSWORD, OTA_PASSWORD: the same as in secrets.yaml
name: Firmware

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ESPHome
        run: pip install esphome==2026.9.1

      - name: Create secrets.yaml
        env:
          AP_PASSWORD: ${{ secrets.AP_PASSWORD }}
          OTA_PASSWORD: ${{ secrets.OTA_PASSWORD }}
        run: |
          test -n "$AP_PASSWORD" && test -n "$OTA_PASSWORD"
          python - <<'PY'
          import json, os
          with open("secrets.yaml", "w") as f:
              # The Dexcom credentials are not on the board; they are only needed to validate.
              f.write('dexcom_username: ""\ndexcom_password: ""\n')
              f.write(f'ap_password: {json.dumps(os.environ["AP_PASSWORD"])}\n')
              f.write(f'ota_password: {json.dumps(os.environ["OTA_PASSWORD"])}\n')
          PY

      - name: Build
        run: esphome -s version "${GITHUB_REF_NAME}" compile guition.yaml

      - name: Prepare binaries and manifest
        run: |
          mkdir -p dist
          cp .esphome/build/glucia/build/firmware.ota.bin dist/glucia.ota.bin
          cp .esphome/build/glucia/build/firmware.factory.bin dist/glucia.factory.bin
          MD5=$(md5sum dist/glucia.ota.bin | cut -d' ' -f1)
          # Absolute paths to this version: the manifest is fetched via "latest", the binary is not.
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > dist/manifest.json <<JSON
          {
            "name": "Glucía",
            "version": "${GITHUB_REF_NAME}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [{ "path": "${URL}/glucia.factory.bin", "offset": 0 }],
                "ota": {
                  "path": "${URL}/glucia.ota.bin",
                  "md5": "${MD5}",
                  "summary": "Version ${GITHUB_REF_NAME}"
                }
              }
            ]
          }
          JSON
          cat dist/manifest.json

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes "Firmware ${GITHUB_REF_NAME}"
