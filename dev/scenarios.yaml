# Fixed test cases for screenshots: each one fills the globals like a data source would.
# Used by dev/screenshots.yaml; not part of any firmware.

globals:
  - id: period
    type: int
    initial_value: "300"

script:
  - id: long_press
    then: []

  # Sets a scenario: newest value, previous value, trend, age in seconds and status.
  - id: set_case
    parameters:
      value: int
      previous: int
      trend_now: int
      age_s: int
      status: string
    then:
      - lambda: |-
          auto now = id(sys_time).now().timestamp;
          const int N = ${history_len};
          std::vector<int> h(N, 0);
          if (value > 0) {
            // A made-up history: a gentle wave that ends in previous -> value
            int step = value - previous;
            for (int k = 0; k < N; k++) {   // k readings before the newest
              int v = k < 4 ? value - step * k : value - step * 4 + (int) (35 * sin((k - 4) / 5.0));
              h[N - 1 - k] = std::max(40, std::min(350, v));
            }
          }
          id(history) = h;
          id(last_ts) = value > 0 ? now - age_s : 0;
          id(delta) = value - previous;
          id(delta_ok) = previous > 0;
          id(trend) = trend_now;
          id(connected) = status.empty();
          id(status_text) = status;
      - script.execute: render
