substitutions:
  # Set by the GitHub Action when publishing (the tag, e.g. v1.2). Local builds: "dev".
  version: "dev"
  # Look on first start; then it is chosen at http://glucia.local (Classic or Kids)
  display_mode: Classic
  theme: Dark   # Light or Dark

esphome:
  name: glucia
  project:
    name: albarin.glucia
    version: "${version}"

packages:
  hardware: !include hardware/guition.yaml
  ui: !include common/ui.yaml
  lang: !include common/lang/es.yaml   # or en.yaml
  data: !include common/dexcom.yaml
