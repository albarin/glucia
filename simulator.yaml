# Look (Classic or Kids) and theme. The simulator has no web page: after changing it, `make sim-reset`
# (the stored choice wins over this one).
substitutions:
  display_mode: Kids
  theme: Light   # Light or Dark (a tap switches it)

esphome:
  name: glucia-sim

packages:
  hardware: !include hardware/simulator.yaml
  ui: !include common/ui.yaml
  lang: !include common/lang/en.yaml   # or es.yaml
  data: !include common/demo.yaml
