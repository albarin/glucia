# Kids UI: a friendly face on a full-screen color, a level gauge and a big arrow.
# Same contract as ui.yaml (same globals, `render` script, needs `period` and `long_press`).

substitutions:
  low_limit: "70"     # mg/dL, below: red
  high_limit: "180"   # mg/dL, above: amber

globals:
  - id: history
    type: std::vector<int>
    initial_value: "std::vector<int>(8, 0)"
  - id: last_ts
    type: int64_t
    initial_value: "0"
  - id: delta
    type: int
    initial_value: "0"
  - id: delta_ok
    type: bool
    initial_value: "false"
  - id: trend
    type: int
    initial_value: "0"
  - id: status_text
    type: std::string
    initial_value: '""'
  - id: connected
    type: bool
    initial_value: "false"
  - id: inverted
    type: bool
    initial_value: "false"

font:
  - file: "gfonts://Roboto@500"
    id: f_medium
    size: 44
    bpp: 4
    glyphs: "0123456789+-Zz"
  - file: "gfonts://Roboto@400"
    id: f_text
    size: 20
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: "áéíóúüñÁÉÍÓÚÜÑ¿¡·"
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: f_arrow
    size: 120
    bpp: 4
    glyphs: [
      "\U000F013F",  # chevron-double-up    (rising fast)
      "\U000F005D",  # arrow-up             (rising)
      "\U000F005C",  # arrow-top-right      (rising slowly)
      "\U000F0054",  # arrow-right          (steady)
      "\U000F0043",  # arrow-bottom-right   (falling slowly)
      "\U000F0045",  # arrow-down           (falling)
      "\U000F013C",  # chevron-double-down  (falling fast)
      "\U000F02D6",  # help                 (not computable)
      "\U000F0374",  # minus                (no trend)
    ]
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: f_icons
    size: 26
    bpp: 4
    glyphs: [
      "\U000F05A9",  # wifi
      "\U000F05AA",  # wifi-off
    ]

lvgl:
  default_font: f_text
  pages:
    - id: main_page
      bg_color: 0x000000
      widgets:
        - obj:
            id: bg
            x: 0
            y: 0
            width: 100%
            height: 100%
            radius: 0
            border_width: 0
            pad_all: 0
            bg_color: 0x000000
            scrollable: false
            on_short_click:
              - lambda: id(inverted) = !id(inverted);
              - script.execute: render
            on_long_press:
              - script.execute: long_press
            widgets:
              # Level gauge: high band on top, in range in the middle, low at the bottom
              - obj:
                  id: gauge
                  x: 20
                  y: 20
                  width: 48
                  height: 280
                  radius: 24
                  pad_all: 0
                  border_width: 4
                  border_color: 0x1F2937
                  clip_corner: true
                  clickable: false
                  scrollable: false
                  widgets:
                    - obj: {id: band_high, x: 0, y: 0,   width: 40, height: 84,  radius: 0, border_width: 0, bg_color: 0xF5B83D, clickable: false, scrollable: false}
                    - obj: {id: band_ok,   x: 0, y: 84,  width: 40, height: 124, radius: 0, border_width: 0, bg_color: 0x4ADE80, clickable: false, scrollable: false}
                    - obj: {id: band_low,  x: 0, y: 208, width: 40, height: 64,  radius: 0, border_width: 0, bg_color: 0xF2545B, clickable: false, scrollable: false}
              - obj:
                  id: marker
                  x: 12
                  y: 140
                  width: 64
                  height: 28
                  radius: 14
                  border_width: 4
                  border_color: 0x000000
                  bg_color: 0xFFFFFF
                  clickable: false
                  scrollable: false
              # Face
              - obj:
                  id: face
                  x: 104
                  y: 56
                  width: 200
                  height: 200
                  radius: 100
                  pad_all: 0
                  border_width: 0
                  bg_color: 0xFFFFFF
                  clickable: false
                  scrollable: false
                  widgets:
                    - obj: {id: eye_l, x: 52,  y: 64, width: 28, height: 28, radius: 14, border_width: 0, bg_color: 0x1F2937, clickable: false, scrollable: false}
                    - obj: {id: eye_r, x: 120, y: 64, width: 28, height: 28, radius: 14, border_width: 0, bg_color: 0x1F2937, clickable: false, scrollable: false}
                    - arc:
                        id: mouth_smile
                        x: 50
                        y: 50
                        width: 100
                        height: 100
                        start_angle: 30
                        end_angle: 150
                        rotation: 0
                        adjustable: false
                        clickable: false
                        arc_color: 0x1F2937
                        arc_width: 12
                        arc_rounded: true
                        indicator:
                          arc_opa: 0%
                        knob:
                          bg_opa: 0%
                          pad_all: 0
                    - obj: {id: mouth_o,    x: 80, y: 124, width: 40, height: 40, radius: 20, border_width: 10, border_color: 0x1F2937, bg_opa: 0%, clickable: false, scrollable: false}
                    - obj: {id: mouth_flat, x: 64, y: 134, width: 72, height: 12, radius: 6,  border_width: 0, bg_color: 0x1F2937, clickable: false, scrollable: false}
              - label: {id: lbl_zz, x: 300, y: 40, text_font: f_medium, text_color: 0x1F2937, text: "Zz"}
              - label:
                  id: lbl_arrow
                  x: 330
                  y: 40
                  text_font: f_arrow
                  text_color: 0x1F2937
                  text: ""
              - label:
                  id: lbl_number
                  x: 336
                  y: 186
                  text_font: f_medium
                  text_color: 0x1F2937
                  text: ""
              - label:
                  id: lbl_unit
                  x: 340
                  y: 236
                  text_color: 0x1F2937
                  text: "mg/dL"
              - label:
                  id: lbl_age
                  x: 332
                  y: 260
                  pad_left: 8
                  pad_right: 8
                  pad_top: 2
                  pad_bottom: 2
                  radius: 8
                  bg_color: 0xB91C1C
                  bg_opa: 0%
                  text_color: 0x1F2937
                  text: ""
              - label:
                  id: lbl_status
                  x: 92
                  y: 10
                  text_color: 0x1F2937
                  text: "${t_starting}"
              - label:
                  id: lbl_wifi
                  align: TOP_RIGHT
                  x: -14
                  y: 8
                  text_font: f_icons
                  text_color: 0x1F2937
                  text: "\U000F05AA"

script:
  - id: render
    then:
      - lambda: |-
          const int low = ${low_limit};
          const int high = ${high_limit};

          auto t = id(sys_time).now();
          int64_t now = t.is_valid() ? (int64_t) t.timestamp : 0;
          int value = id(history)[7];
          bool has_data = value > 0 && id(last_ts) > 0;
          int64_t age = (has_data && now > 0) ? now - id(last_ts) : -1;
          bool stale = has_data && age > 3 * id(period);
          bool live = has_data && !stale;

          // Zone: -1 low, 0 in range, 1 high
          int zone = value < low ? -1 : value > high ? 1 : 0;
          const uint32_t GREY = 0x6B7280;
          uint32_t zone_color = !live ? GREY : zone < 0 ? 0xF2545B : zone > 0 ? 0xF5B83D : 0x4ADE80;
          // Night mode (tap): black background and the zone color moves to the face
          bool night = id(inverted);
          uint32_t bg_color = night ? 0x000000 : zone_color;
          uint32_t face_color = night ? zone_color : 0xFFFFFF;
          const uint32_t INK = night ? 0xE5E7EB : 0x1F2937;

          auto set_text = [](lv_obj_t *obj, const std::string &txt) {
            if (txt != lv_label_get_text(obj)) lv_label_set_text(obj, txt.c_str());
          };
          auto set_ink = [](lv_obj_t *obj, uint32_t c) {
            lv_color_t next = lv_color_hex(c);
            if (!lv_color_eq(lv_obj_get_style_text_color(obj, LV_PART_MAIN), next)) lv_obj_set_style_text_color(obj, next, 0);
          };
          auto set_fill = [](lv_obj_t *obj, uint32_t c) {
            lv_color_t next = lv_color_hex(c);
            if (!lv_color_eq(lv_obj_get_style_bg_color(obj, LV_PART_MAIN), next)) lv_obj_set_style_bg_color(obj, next, 0);
          };
          auto set_hidden = [](lv_obj_t *obj, bool hide) {
            if (hide == lv_obj_has_flag(obj, LV_OBJ_FLAG_HIDDEN)) return;
            if (hide) lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_remove_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };
          auto set_box = [](lv_obj_t *obj, int x, int y, int w, int h) {
            if (lv_obj_get_x(obj) != x) lv_obj_set_x(obj, x);
            if (lv_obj_get_y(obj) != y) lv_obj_set_y(obj, y);
            if (lv_obj_get_style_width(obj, LV_PART_MAIN) != w) lv_obj_set_width(obj, w);
            if (lv_obj_get_style_height(obj, LV_PART_MAIN) != h) lv_obj_set_height(obj, h);
          };
          auto format = [](const char *fmt, int n) {
            char buf[64];
            snprintf(buf, sizeof(buf), fmt, n);
            return std::string(buf);
          };

          set_fill(id(bg), bg_color);
          set_fill(id(face), face_color);
          lv_obj_t *gg = (lv_obj_t *) id(gauge);
          if (!lv_color_eq(lv_obj_get_style_border_color(gg, LV_PART_MAIN), lv_color_hex(INK)))
            lv_obj_set_style_border_color(gg, lv_color_hex(INK), 0);
          // Without fresh data the gauge fades: it isn't pointing at anything
          lv_opa_t gauge_opa = live ? LV_OPA_COVER : LV_OPA_40;
          if (lv_obj_get_style_opa(gg, LV_PART_MAIN) != gauge_opa) lv_obj_set_style_opa(gg, gauge_opa, 0);
          for (auto *l : {id(lbl_zz), id(lbl_arrow), id(lbl_number), id(lbl_unit), id(lbl_status)})
            set_ink((lv_obj_t *) l, INK);

          // Gauge marker: piecewise scale so each band has a readable size.
          // 40-70 -> bottom 64 px, 70-180 -> middle 124 px, 180-300 -> top 84 px (gauge inner height 272).
          lv_obj_t *mk = (lv_obj_t *) id(marker);
          set_hidden(mk, !live);
          if (live) {
            int v = std::max(40, std::min(300, value));
            int from_bottom;
            if (v < low) from_bottom = (v - 40) * 64 / (low - 40);
            else if (v <= high) from_bottom = 64 + (v - low) * 124 / (high - low);
            else from_bottom = 188 + (v - high) * 84 / (300 - high);
            int y = 24 + 272 - from_bottom - 14;
            set_box(mk, 12, y, 64, 28);
          }

          static const char *ARROWS[] = {
            "\U000F0374", "\U000F013F", "\U000F005D", "\U000F005C", "\U000F0054",
            "\U000F0043", "\U000F0045", "\U000F013C", "\U000F02D6", "\U000F0374",
          };
          int tr = id(trend);
          if (tr < 0 || tr > 9) tr = 0;

          // Face: smile in range, "oh" when low, flat when high, asleep without fresh data
          bool asleep = !live;
          set_hidden((lv_obj_t *) id(mouth_smile), asleep || zone != 0);
          set_hidden((lv_obj_t *) id(mouth_o), asleep || zone >= 0);
          set_hidden((lv_obj_t *) id(mouth_flat), !asleep && zone <= 0);
          set_hidden((lv_obj_t *) id(lbl_zz), !asleep);
          lv_obj_t *el = (lv_obj_t *) id(eye_l);
          lv_obj_t *er = (lv_obj_t *) id(eye_r);
          if (asleep) {
            set_box(el, 48, 76, 36, 8);
            set_box(er, 116, 76, 36, 8);
          } else {
            // Pupils look up when rising, down when falling
            int look = (tr >= 1 && tr <= 3) ? -12 : (tr >= 5 && tr <= 7) ? 12 : 0;
            set_box(el, 52, 64 + look, 28, 28);
            set_box(er, 120, 64 + look, 28, 28);
          }

          // Trend arrow
          set_text((lv_obj_t *) id(lbl_arrow), live ? ARROWS[tr] : "");

          // Number, for grown-ups
          set_text((lv_obj_t *) id(lbl_number), has_data ? std::to_string(value) : "");
          set_hidden((lv_obj_t *) id(lbl_unit), !has_data);

          std::string age_text = "";
          if (age >= 0) {
            int min = age / 60;
            if (min >= 1) age_text = format("${t_minutes_ago}", min);
            else age_text = stale ? format("${t_seconds_ago}", (int) age) : "${t_now}";
          }
          lv_obj_t *age_lbl = (lv_obj_t *) id(lbl_age);
          set_text(age_lbl, age_text);
          // Old data: the number fades and the age stands out
          lv_opa_t num_opa = stale ? LV_OPA_40 : LV_OPA_COVER;
          lv_obj_t *num = (lv_obj_t *) id(lbl_number);
          if (lv_obj_get_style_text_opa(num, LV_PART_MAIN) != num_opa) {
            lv_obj_set_style_text_opa(num, num_opa, 0);
            lv_obj_set_style_text_opa((lv_obj_t *) id(lbl_unit), num_opa, 0);
          }
          lv_opa_t pill = stale ? LV_OPA_COVER : LV_OPA_TRANSP;
          if (lv_obj_get_style_bg_opa(age_lbl, LV_PART_MAIN) != pill) lv_obj_set_style_bg_opa(age_lbl, pill, 0);
          set_ink(age_lbl, stale ? 0xFFFFFF : INK);

          std::string status = id(status_text);
          if (status.empty() && stale) status = "${t_no_new_data}";
          set_text((lv_obj_t *) id(lbl_status), status);

          lv_obj_t *wifi = (lv_obj_t *) id(lbl_wifi);
          set_text(wifi, id(connected) ? "\U000F05A9" : "\U000F05AA");
          set_ink(wifi, INK);

interval:
  - interval: 1s
    then:
      - script.execute: render
