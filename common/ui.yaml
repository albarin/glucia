# UI: both looks (classic and kids) in the same firmware, chosen from the local web page.
# Same on the simulator and on the board.
# Needs the data package (demo.yaml or dexcom.yaml) to define:
#   - the global `period` (seconds between readings)
#   - the script `long_press`
# and a language package (lang/en.yaml or lang/es.yaml) for the texts.
# Each look has its own LVGL page and its own render script; `render` draws the chosen one.
# The settings screen (ui-settings.yaml) opens by holding the gear for 2 s.
# Needs a `light` with id `backlight` (hardware package) for the brightness.

substitutions:
  low_limit: "70"     # mg/dL, below: red
  high_limit: "180"   # mg/dL, above: amber
  history_len: "36"   # readings kept for the chart, one per `period` (36 x 5 min = 3 h)
  display_mode: "Classic"   # until it is changed on the web page: Classic or Kids
  theme: "Dark"             # until it is changed on the web page or with a gesture: Light or Dark
  hold_corner_px: "80"      # hidden gestures: size of the top corners (px)
  hold_ms: "5000"           # hidden gestures: how long to hold (ms)
  gear_hold_ms: "2000"      # how long to hold the gear to open the settings (ms)
  settings_timeout_ms: "60000"   # the settings close on their own after this long without touches

packages:
  classic: !include ui-classic.yaml
  kids: !include ui-kids.yaml
  settings: !include ui-settings.yaml

globals:
  # Readings in mg/dL, one slot per `period`, placed by time: back() is the newest,
  # each slot before it one period earlier. 0 = no reading (a gap in the chart).
  - id: history
    type: std::vector<int>
    initial_value: "std::vector<int>(${history_len}, 0)"
  # Time of the last reading, in Unix seconds (the one Dexcom reports, not when it arrived).
  - id: last_ts
    type: int64_t
    initial_value: "0"
  - id: delta
    type: int
    initial_value: "0"
  - id: delta_ok
    type: bool
    initial_value: "false"
  # Trend as Dexcom numbers it: 1 rising fast ... 4 steady ... 7 falling fast.
  - id: trend
    type: int
    initial_value: "0"
  # Error or status message shown at the top left.
  - id: status_text
    type: std::string
    initial_value: '""'
  # Did the last request to the data source work?
  - id: connected
    type: bool
    initial_value: "false"
  # Is the settings screen showing? Then `render` leaves the page alone.
  - id: in_settings
    type: bool
    initial_value: "false"
  # Hidden gestures: which top corner the finger went down on (0 none, 1 left, 2 right, 3 the gear),
  # since when (millis) and whether this press already did its action.
  - id: hold_corner
    type: int
    initial_value: "0"
  - id: hold_since
    type: uint32_t
    initial_value: "0"
  - id: hold_done
    type: bool
    initial_value: "false"

# Shown on the local web page. The name is fixed in English: the stored choice is keyed by it.
select:
  - platform: template
    id: display_mode
    name: "Display mode"
    options: ["Classic", "Kids"]
    initial_option: "${display_mode}"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: render
  # Light: the range color fills the screen. Dark: black background.
  - platform: template
    id: theme
    name: "Theme"
    options: ["Light", "Dark"]
    initial_option: "${theme}"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: render

font:
  - file: "gfonts://Roboto@500"
    id: f_medium
    size: 44
    bpp: 4
    glyphs: "0123456789+-"
  - file: "gfonts://Roboto@400"
    id: f_text
    size: 20
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: "áéíóúüñÁÉÍÓÚÜÑ¿¡·"
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: f_icons
    size: 26
    bpp: 4
    glyphs: [
      "\U000F05A9",  # wifi
      "\U000F05AA",  # wifi-off
      "\U000F0493",  # cog (settings)
      "\U000F004D",  # arrow-left (back)
    ]

lvgl:
  default_font: f_text

script:
  # Draws the globals on screen. Called when a reading arrives and once per second.
  # Only the page on screen is drawn; switching looks shows the other page.
  - id: render
    then:
      - if:
          condition:
            lambda: return id(in_settings);
          then:
            - script.execute: render_settings
          else:
            - if:
                condition:
                  lambda: return id(display_mode).active_index().value_or(0) == 1;
                then:
                  - if:
                      condition:
                        lambda: return !id(kids_page)->is_showing();
                      then:
                        - lvgl.page.show: kids_page
                  - script.execute: render_kids
                else:
                  - if:
                      condition:
                        lambda: return !id(classic_page)->is_showing();
                      then:
                        - lvgl.page.show: classic_page
                  - script.execute: render_classic

  # Hidden gestures, so a child can't trigger them by accident:
  #   hold the top-left corner for 5 s  -> light/dark theme
  #   hold the top-right corner for 5 s -> classic/kids look
  # A long press anywhere else does what the data source wants (`long_press`).
  - id: touch_down
    then:
      - lambda: |-
          lv_point_t p;
          lv_indev_get_point(lv_indev_active(), &p);
          const int CORNER = ${hold_corner_px};
          id(hold_corner) = p.y >= CORNER ? 0 : p.x < CORNER ? 1 : p.x >= lv_display_get_horizontal_resolution(nullptr) - CORNER ? 2 : 0;
          id(hold_since) = millis();
          id(hold_done) = false;
          // Also handy on the board to check the touch orientation
          ESP_LOGD("touch", "Press at %d,%d (corner %d)", (int) p.x, (int) p.y, id(hold_corner));

  # The gear: same as a corner, but it opens the settings after ${gear_hold_ms} ms
  - id: gear_down
    then:
      - lambda: |-
          id(hold_corner) = 3;
          id(hold_since) = millis();
          id(hold_done) = false;

  - id: touch_long_press
    then:
      - if:
          condition:
            lambda: return id(hold_corner) == 0;
          then:
            - script.execute: long_press

  # Called every ~100 ms while the finger stays down after a long press
  - id: touch_held
    then:
      - lambda: |-
          // The gear tracks its own press (LVGL stops the repeats if the finger leaves it)
          if (id(hold_corner) == 0 || id(hold_corner) == 3) return;
          // Sliding out of the corner cancels it
          lv_point_t p;
          lv_indev_get_point(lv_indev_active(), &p);
          const int CORNER = ${hold_corner_px};
          int corner = p.y >= CORNER ? 0 : p.x < CORNER ? 1 : p.x >= lv_display_get_horizontal_resolution(nullptr) - CORNER ? 2 : 0;
          if (corner != id(hold_corner)) id(hold_corner) = 0;
      - if:
          condition:
            lambda: |-
              if (id(hold_corner) == 0 || id(hold_done)) return false;
              return millis() - id(hold_since) >= (id(hold_corner) == 3 ? ${gear_hold_ms} : ${hold_ms});
          then:
            - lambda: |-
                id(hold_done) = true;
                static const char *WHAT[] = {"", "theme", "look", "settings"};
                ESP_LOGI("touch", "Hold: %s", WHAT[id(hold_corner)]);
            - if:
                condition:
                  lambda: return id(hold_corner) == 3;
                then:
                  - script.execute: open_settings
                else:
                  - if:
                      condition:
                        lambda: return id(hold_corner) == 1;
                      then:
                        - select.next: { id: theme, cycle: true }
                      else:
                        - select.next: { id: display_mode, cycle: true }

interval:
  # The countdown and the age of the reading change on their own over time.
  - interval: 1s
    then:
      - script.execute: render
  # Nobody touched the settings for a while: back to the glucose
  - interval: 5s
    then:
      - if:
          condition:
            lambda: return id(in_settings) && lv_display_get_inactive_time(nullptr) > ${settings_timeout_ms};
          then:
            - script.execute: close_settings
