# Classic UI: big number, arrow, change, countdown and a chart of the last 3 hours.
# Part of ui.yaml (globals, shared fonts and `render` live there).

font:
  - file: "gfonts://Roboto@700"
    id: f_number
    size: 150
    bpp: 4
    glyphs: "0123456789-"
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: f_arrow
    size: 96
    bpp: 4
    glyphs: [
      "\U000F013F",  # chevron-double-up    (rising fast)
      "\U000F005D",  # arrow-up             (rising)
      "\U000F005C",  # arrow-top-right      (rising slowly)
      "\U000F0054",  # arrow-right          (steady)
      "\U000F0043",  # arrow-bottom-right   (falling slowly)
      "\U000F0045",  # arrow-down           (falling)
      "\U000F013C",  # chevron-double-down  (falling fast)
      "\U000F02D6",  # help                 (not computable)
      "\U000F0374",  # minus                (no trend)
    ]

lvgl:
  pages:
    - id: classic_page
      bg_color: 0x000000
      widgets:
        # Full-screen background: receives touches and takes the range color with the light theme.
        - obj:
            id: bg
            x: 0
            y: 0
            width: 100%
            height: 100%
            radius: 0
            border_width: 0
            pad_all: 0
            bg_color: 0x000000
            scrollable: false
            # Hidden gestures (ui.yaml): hold a top corner for 5 s
            on_press:
              - script.execute: touch_down
            on_long_press:
              - script.execute: touch_long_press
            on_long_press_repeat:
              - script.execute: touch_held
            widgets:
              - label:
                  id: lbl_status
                  x: 16
                  y: 10
                  text_color: 0x9CA3AF
                  text: "${t_starting}"
              - label:
                  id: lbl_wifi
                  align: TOP_RIGHT
                  x: -54
                  y: 10
                  text_font: f_icons
                  text_color: 0x9CA3AF
                  text: "\U000F05AA"
              # Settings: hold for 2 s (a tap does nothing, so a child doesn't open them by accident)
              - obj:
                  id: gear
                  align: TOP_RIGHT
                  x: -4
                  y: 0
                  width: 52
                  height: 48
                  pad_all: 0
                  border_width: 0
                  bg_opa: 0%
                  scrollable: false
                  on_press:
                    - script.execute: gear_down
                  on_long_press_repeat:
                    - script.execute: touch_held
                  widgets:
                    - label:
                        id: gear_icon
                        align: CENTER
                        text_font: f_icons
                        text_color: 0x9CA3AF
                        text: "\U000F0493"
              - label:
                  id: lbl_number
                  x: 10
                  y: 30
                  width: 310
                  text_align: CENTER
                  text_font: f_number
                  text_color: 0x6B7280
                  text: "--"
              - label:
                  id: lbl_arrow
                  x: 330
                  y: 36
                  text_font: f_arrow
                  text_color: 0xFFFFFF
                  text: ""
              - label:
                  id: lbl_delta
                  x: 336
                  y: 136
                  text_font: f_medium
                  text_color: 0xFFFFFF
                  text: ""
              - label:
                  id: lbl_unit
                  x: 338
                  y: 186
                  text_color: 0xFFFFFF
                  text: "mg/dL"
              - bar:
                  id: countdown_bar
                  x: 30
                  y: 208
                  width: 270
                  height: 8
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x333333
                  indicator:
                    bg_color: 0xE5E7EB
              - label:
                  id: lbl_age
                  x: 338
                  y: 214
                  text_color: 0x9CA3AF
                  text: ""
              # Last 3 hours as a line colored by zone, with the range limits as reference.
              # The line is drawn in `render_classic`. Light theme: on a black card, so the zone colors show.
              - obj: {id: chart_card, x: 6, y: 240, width: 468, height: 78, radius: 14, border_width: 0, bg_color: 0x000000, clickable: false, scrollable: false}
              - label: {id: lbl_high, x: 16, y: 264, text_color: 0x9CA3AF, text: "${high_limit}"}
              - label: {id: lbl_low,  x: 16, y: 291, text_color: 0x9CA3AF, text: "${low_limit}"}
              - obj:
                  id: chart
                  x: 60
                  y: 244
                  width: 406
                  height: 70
                  radius: 0
                  pad_all: 0
                  border_width: 0
                  bg_opa: 0%
                  clickable: false
                  scrollable: false

script:
  - id: render_classic
    then:
      - lambda: |-
          const int low = ${low_limit};
          const int high = ${high_limit};

          // What time is it and how old is the reading?
          auto t = id(sys_time).now();
          int64_t now = t.is_valid() ? (int64_t) t.timestamp : 0;
          int value = id(history).back();
          bool has_data = value > 0 && id(last_ts) > 0;
          int64_t age = (has_data && now > 0) ? now - id(last_ts) : -1;
          bool stale = has_data && age > 3 * id(period);   // 3 missed readings

          // Colors
          auto color_of = [&](int v) -> uint32_t {
            if (v <= 0) return 0x333333;    // no data
            if (v < low) return 0xF2545B;   // red
            if (v > high) return 0xF5B83D;  // amber
            return 0x4ADE80;                // green
          };
          const uint32_t GREY = 0x6B7280;
          uint32_t color = (has_data && !stale) ? color_of(value) : GREY;
          // Light theme: the range color becomes the background (only with fresh data)
          bool inv = id(theme).active_index().value_or(0) == 0 && has_data && !stale;
          uint32_t bg_color = inv ? color : 0x000000;
          uint32_t ink = inv ? 0x000000 : 0xFFFFFF;
          uint32_t soft_ink = inv ? 0x000000 : 0x9CA3AF;

          // Only change text, colors and sizes when they differ: LVGL redraws
          // on every change even if the value is the same.
          auto set_text = [](lv_obj_t *obj, const std::string &txt) {
            if (txt != lv_label_get_text(obj)) lv_label_set_text(obj, txt.c_str());
          };
          auto set_ink = [](lv_obj_t *obj, uint32_t c) {
            lv_color_t next = lv_color_hex(c);
            if (!lv_color_eq(lv_obj_get_style_text_color(obj, LV_PART_MAIN), next)) lv_obj_set_style_text_color(obj, next, 0);
          };
          auto set_fill = [](lv_obj_t *obj, uint32_t c, lv_part_t part) {
            lv_color_t next = lv_color_hex(c);
            if (!lv_color_eq(lv_obj_get_style_bg_color(obj, part), next)) lv_obj_set_style_bg_color(obj, next, part);
          };
          auto set_hidden = [](lv_obj_t *obj, bool hide) {
            if (hide == lv_obj_has_flag(obj, LV_OBJ_FLAG_HIDDEN)) return;
            if (hide) lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_remove_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };
          auto format = [](const char *fmt, int n) {
            char buf[64];
            snprintf(buf, sizeof(buf), fmt, n);
            return std::string(buf);
          };

          set_fill(id(bg), bg_color, LV_PART_MAIN);

          // Big number
          lv_obj_t *number = (lv_obj_t *) id(lbl_number);
          set_text(number, has_data ? std::to_string(value) : "--");
          set_ink(number, inv ? 0x000000 : color);

          // Trend arrow
          static const char *ARROWS[] = {
            "\U000F0374", "\U000F013F", "\U000F005D", "\U000F005C", "\U000F0054",
            "\U000F0043", "\U000F0045", "\U000F013C", "\U000F02D6", "\U000F0374",
          };
          int tr = id(trend);
          if (tr < 0 || tr > 9) tr = 0;
          lv_obj_t *arrow = (lv_obj_t *) id(lbl_arrow);
          set_text(arrow, (has_data && !stale) ? ARROWS[tr] : "");
          set_ink(arrow, ink);

          // Change since the previous reading
          lv_obj_t *dlt = (lv_obj_t *) id(lbl_delta);
          std::string delta_text = "";
          if (has_data && !stale && id(delta_ok))
            delta_text = (id(delta) > 0 ? "+" : "") + std::to_string(id(delta));
          set_text(dlt, delta_text);
          set_ink(dlt, ink);
          set_ink((lv_obj_t *) id(lbl_unit), ink);

          // Age of the reading
          lv_obj_t *age_lbl = (lv_obj_t *) id(lbl_age);
          std::string age_text = "";
          if (age >= 0) {
            int min = age / 60;
            if (min >= 1) age_text = format("${t_minutes_ago}", min);
            else age_text = stale ? format("${t_seconds_ago}", (int) age) : "${t_now}";
          }
          set_text(age_lbl, age_text);
          set_ink(age_lbl, stale ? 0xF2545B : soft_ink);

          // Status at the top left: data source error or stale data warning
          lv_obj_t *status_lbl = (lv_obj_t *) id(lbl_status);
          std::string status = id(status_text);
          if (status.empty() && stale) status = "${t_no_new_data}";
          set_text(status_lbl, status);
          set_ink(status_lbl, soft_ink);

          // Connection icon
          lv_obj_t *wifi = (lv_obj_t *) id(lbl_wifi);
          set_text(wifi, id(connected) ? "\U000F05A9" : "\U000F05AA");
          set_ink(wifi, id(connected) ? soft_ink : 0xF2545B);
          set_ink((lv_obj_t *) id(gear_icon), soft_ink);

          // Countdown bar until the next reading
          lv_obj_t *countdown = (lv_obj_t *) id(countdown_bar);
          int pct = 0;
          if (has_data && !stale && now > 0) {
            int64_t remaining = id(last_ts) + id(period) - now;
            pct = (int) (remaining * 100 / id(period));
            pct = std::max(0, std::min(100, pct));
          }
          lv_bar_set_value(countdown, pct, LV_ANIM_OFF);
          set_fill(countdown, inv ? 0x000000 : 0xE5E7EB, LV_PART_INDICATOR);
          set_hidden(countdown, stale || !has_data);

          // Chart: what it draws lives in statics, so the draw callback can read it.
          static std::vector<int> chart_hist;
          static bool chart_mono = false;   // one color for the whole line instead of zone colors
          static uint32_t chart_mono_color = 0;
          static uint32_t chart_ref = 0;    // reference lines
          static lv_opa_t chart_ref_opa = LV_OPA_COVER;
          lv_obj_t *ch = (lv_obj_t *) id(chart);
          static bool chart_ready = false;
          if (!chart_ready) {
            chart_ready = true;
            lv_obj_add_event_cb(ch, [](lv_event_t *e) {
              lv_layer_t *layer = lv_event_get_layer(e);
              lv_area_t a;
              lv_obj_get_coords((lv_obj_t *) lv_event_get_target(e), &a);
              const int w = lv_area_get_width(&a), h = lv_area_get_height(&a);
              const int lo = ${low_limit}, hi = ${high_limit};
              // Value -> y: 40 at the bottom, 300 at the top (pad 3 px for the line width)
              auto y_of = [&](float v) -> float {
                v = std::max(40.0f, std::min(300.0f, v));
                return a.y1 + 3 + (300 - v) * (h - 7) / 260.0f;
              };
              lv_draw_line_dsc_t d;
              lv_draw_line_dsc_init(&d);
              auto line = [&](float x1, float y1, float x2, float y2, uint32_t c) {
                d.p1.x = x1; d.p1.y = y1; d.p2.x = x2; d.p2.y = y2;
                d.color = lv_color_hex(c);
                lv_draw_line(layer, &d);
              };

              d.width = 2;
              d.opa = chart_ref_opa;
              for (int lim : {lo, hi}) line(a.x1, y_of(lim), a.x2, y_of(lim), chart_ref);

              const int n = chart_hist.size();
              if (n < 2) return;
              auto x_of = [&](int i) -> float { return a.x1 + 3 + (float) i * (w - 7) / (n - 1); };
              auto color_of = [&](float v) -> uint32_t {
                if (chart_mono) return chart_mono_color;
                return v < lo ? 0xF2545B : v > hi ? 0xF5B83D : 0x4ADE80;
              };
              d.width = 4;
              d.opa = LV_OPA_COVER;
              d.round_start = 1;
              d.round_end = 1;
              for (int i = 0; i < n; i++) {
                float v1 = chart_hist[i];
                if (v1 <= 0) continue;
                float v2 = i + 1 < n ? chart_hist[i + 1] : 0;
                bool alone = v2 <= 0 && (i == 0 || chart_hist[i - 1] <= 0);
                if (alone) { line(x_of(i), y_of(v1), x_of(i), y_of(v1), color_of(v1)); continue; }
                if (v2 <= 0) continue;
                // Split the segment where it crosses a limit, so each piece has its zone color
                float cuts[4] = {0, 1, 1, 1};
                int nc = 1;
                for (int lim : {lo, hi})
                  if ((v1 - lim) * (v2 - lim) < 0) cuts[nc++] = (lim - v1) / (v2 - v1);
                std::sort(cuts, cuts + nc);
                cuts[nc++] = 1;
                for (int k = 0; k + 1 < nc; k++) {
                  float ta = cuts[k], tb = cuts[k + 1];
                  float va = v1 + (v2 - v1) * ta, vb = v1 + (v2 - v1) * tb;
                  float xa = x_of(i) + (x_of(i + 1) - x_of(i)) * ta, xb = x_of(i) + (x_of(i + 1) - x_of(i)) * tb;
                  line(xa, y_of(va), xb, y_of(vb), color_of((va + vb) / 2));
                }
              }
            }, LV_EVENT_DRAW_MAIN, nullptr);
          }
          // Always on black (the page or the card): zone colors, grey with stale data
          set_hidden((lv_obj_t *) id(chart_card), !inv);
          bool mono = stale;
          uint32_t mono_color = GREY;
          uint32_t ref = 0x6B7280;
          lv_opa_t ref_opa = LV_OPA_COVER;
          if (chart_hist != id(history) || chart_mono != mono || chart_mono_color != mono_color || chart_ref != ref || chart_ref_opa != ref_opa) {
            chart_hist = id(history);
            chart_mono = mono;
            chart_mono_color = mono_color;
            chart_ref = ref;
            chart_ref_opa = ref_opa;
            lv_obj_invalidate(ch);
          }
          // Labels of the reference lines (their y in the page matches y_of for 180 and 70)
          for (auto *l : {id(lbl_high), id(lbl_low)}) set_ink((lv_obj_t *) l, 0x9CA3AF);
