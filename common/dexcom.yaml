# Real data from Dexcom Share (unofficial API, the same one pydexcom uses).
# The credentials are those of the MAIN Dexcom account (the person wearing the sensor),
# with Share enabled and at least one accepted follower.
# Long press on the screen: forces a reading now.

substitutions:
  # Initial credentials. Empty on the board: they are set from its local web page
  # (http://glucia.local) and stored on the device. The simulator takes them from secrets.yaml.
  dexcom_username: ""
  dexcom_password: ""
  # Outside the US (Spain included). In the US it would be https://share2.dexcom.com/...
  dexcom_url: "https://shareous1.dexcom.com/ShareWebServices/Services/"
  dexcom_app_id: "d89443d2-327c-4a6f-89e5-496bbb0317db"

globals:
  - id: period
    type: int
    initial_value: "300"   # Dexcom sends a reading every 5 minutes
  - id: dx_account
    type: std::string
    initial_value: '""'
  - id: dx_session
    type: std::string
    initial_value: '""'
  # Don't try to sign in again before this time (Unix seconds).
  # Keeps a wrong password from locking the Dexcom account through retries.
  - id: dx_wait_until
    type: int64_t
    initial_value: "0"

# Credentials stored on the device itself: they are not part of the firmware.
# They are changed from the local web page and survive reboots and updates.
# Names are fixed (not translated): the stored value is keyed by the name.
text:
  - platform: template
    id: dexcom_username
    name: "Dexcom username"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${dexcom_username}"
    on_value:
      - script.execute: dexcom_reset
  - platform: template
    id: dexcom_password
    name: "Dexcom password"
    mode: password
    optimistic: true
    restore_value: true
    initial_value: "${dexcom_password}"
    on_value:
      - script.execute: dexcom_reset

script:
  # New credentials: drop the session and the wait from earlier failures.
  # Don't sign in right away: the next round (1 min at most) will have both username and password.
  - id: dexcom_reset
    then:
      - lambda: |-
          id(dx_account) = "";
          id(dx_session) = "";
          id(dx_wait_until) = 0;

  # 1) username + password -> account ID; 2) account ID + password -> session ID
  - id: dexcom_login
    then:
      - lambda: |-
          id(dx_account) = "";
          id(dx_session) = "";
      - http_request.post:
          url: ${dexcom_url}General/AuthenticatePublisherAccount
          request_headers:
            Content-Type: application/json
            Accept: application/json
          json: |-
            root["accountName"] = id(dexcom_username).state;
            root["password"] = id(dexcom_password).state;
            root["applicationId"] = "${dexcom_app_id}";
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  id(connected) = true;
                  if (response->status_code != 200) {
                    ESP_LOGW("dexcom", "Login step 1 failed (%d): %s", response->status_code, body.c_str());
                    bool credentials = body.find("AccountPassword") != std::string::npos ||
                                       body.find("Authenticate") != std::string::npos ||
                                       body.find("accountName") != std::string::npos;
                    id(status_text) = credentials ? "${t_dexcom_bad_credentials}" : "${t_dexcom_login_error}";
                    // Wrong credentials: don't retry for 30 min. Any other error: 2 min.
                    auto t = id(sys_time).now();
                    if (t.is_valid()) id(dx_wait_until) = (int64_t) t.timestamp + (credentials ? 1800 : 120);
                    return;
                  }
                  // The response is the UUID in quotes: "1234-..."
                  std::string s = body;
                  s.erase(std::remove(s.begin(), s.end(), '"'), s.end());
                  id(dx_account) = s;
          on_error:
            then:
              - lambda: |-
                  id(connected) = false;
                  id(status_text) = "${t_dexcom_unreachable}";
      - if:
          condition:
            lambda: return !id(dx_account).empty();
          then:
            - http_request.post:
                url: ${dexcom_url}General/LoginPublisherAccountById
                request_headers:
                  Content-Type: application/json
                  Accept: application/json
                json: |-
                  root["accountId"] = id(dx_account);
                  root["password"] = id(dexcom_password).state;
                  root["applicationId"] = "${dexcom_app_id}";
                capture_response: true
                max_response_buffer_size: 1024
                on_response:
                  then:
                    - lambda: |-
                        std::string s = body;
                        s.erase(std::remove(s.begin(), s.end(), '"'), s.end());
                        // An all-zeros UUID is also a failure
                        if (response->status_code != 200 || s.empty() || s == "00000000-0000-0000-0000-000000000000") {
                          ESP_LOGW("dexcom", "Login step 2 failed (%d): %s", response->status_code, body.c_str());
                          id(status_text) = "${t_dexcom_login_error}";
                          auto t = id(sys_time).now();
                          if (t.is_valid()) id(dx_wait_until) = (int64_t) t.timestamp + 120;
                          return;
                        }
                        id(dx_session) = s;
                        ESP_LOGI("dexcom", "Signed in");
                on_error:
                  then:
                    - lambda: |-
                        id(connected) = false;
                        id(status_text) = "${t_dexcom_unreachable}";

  # Reads the last 8 readings (up to 1 hour back) and fills the globals.
  - id: dexcom_read
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              if (!network::is_connected()) {
                id(connected) = false;
                id(status_text) = "${t_no_wifi}";
                return false;
              }
              if (id(dexcom_username).state.empty() || id(dexcom_password).state.empty()) {
                id(status_text) = "${t_dexcom_missing}";
                return false;
              }
              if (!id(dx_session).empty()) return false;
              // Without the time we can't honor the wait after a failure: better not to try.
              auto t = id(sys_time).now();
              if (!t.is_valid()) {
                id(status_text) = "${t_connecting}";
                return false;
              }
              return (int64_t) t.timestamp >= id(dx_wait_until);
          then:
            - script.execute: dexcom_login
            - script.wait: dexcom_login
      - if:
          condition:
            lambda: return network::is_connected() && !id(dx_session).empty();
          then:
            - http_request.post:
                url: !lambda |-
                  return "${dexcom_url}Publisher/ReadPublisherLatestGlucoseValues?sessionId=" + id(dx_session) + "&minutes=60&maxCount=8";
                request_headers:
                  Content-Type: application/json
                  Accept: application/json
                body: "{}"
                capture_response: true
                max_response_buffer_size: 4096
                on_response:
                  then:
                    - lambda: |-
                        id(connected) = true;
                        if (response->status_code != 200) {
                          ESP_LOGW("dexcom", "Read failed (%d): %s", response->status_code, body.c_str());
                          // Session expired: sign in again on the next round
                          if (body.find("SessionIdNotFound") != std::string::npos || body.find("SessionNotValid") != std::string::npos) {
                            id(dx_session) = "";
                          } else {
                            char buf[64];
                            snprintf(buf, sizeof(buf), "${t_dexcom_error}", response->status_code);
                            id(status_text) = buf;
                          }
                          return;
                        }

                        JsonDocument doc;
                        if (deserializeJson(doc, body)) {
                          ESP_LOGW("dexcom", "Response is not JSON: %s", body.c_str());
                          id(status_text) = "${t_dexcom_bad_response}";
                          return;
                        }
                        JsonArray readings = doc.as<JsonArray>();
                        if (readings.size() == 0) {
                          id(status_text) = "${t_dexcom_no_readings}";
                          return;
                        }

                        // "WT": "Date(1728662400000)" -> Unix seconds
                        auto to_seconds = [](const char *wt) -> int64_t {
                          std::string w = wt ? wt : "";
                          size_t start = w.find('('), end = w.find_first_of("+-)", start + 1);
                          if (start == std::string::npos || end == std::string::npos) return 0;
                          return atoll(w.substr(start + 1, end - start - 1).c_str()) / 1000;
                        };

                        // Dexcom returns the newest first; the history wants it last.
                        std::vector<int> h(8, 0);
                        int n = std::min((int) readings.size(), 8);
                        for (int i = 0; i < n; i++) h[7 - i] = readings[i]["Value"].as<int>();
                        id(history) = h;
                        id(last_ts) = to_seconds(readings[0]["WT"].as<const char *>());

                        // Delta only if the previous one is about 5 minutes earlier
                        id(delta_ok) = false;
                        if (n > 1) {
                          int64_t gap = id(last_ts) - to_seconds(readings[1]["WT"].as<const char *>());
                          if (gap > 0 && gap <= 7 * 60) {
                            id(delta) = h[7] - h[6];
                            id(delta_ok) = true;
                          }
                        }

                        // The trend can come as text ("Flat") or as a number (4)
                        JsonVariant tv = readings[0]["Trend"];
                        int tr = 0;
                        if (tv.is<int>()) {
                          tr = tv.as<int>();
                        } else {
                          static const char *NAMES[] = {"None", "DoubleUp", "SingleUp", "FortyFiveUp", "Flat",
                            "FortyFiveDown", "SingleDown", "DoubleDown", "NotComputable", "RateOutOfRange"};
                          std::string s = tv.as<std::string>();
                          for (int i = 0; i < 10; i++) if (s == NAMES[i]) tr = i;
                        }
                        id(trend) = tr;
                        id(status_text) = "";
                        ESP_LOGI("dexcom", "Reading: %d mg/dL, trend %d", h[7], tr);
                on_error:
                  then:
                    - lambda: |-
                        id(connected) = false;
                        id(status_text) = "${t_dexcom_unreachable}";
      - script.execute: render

  - id: long_press
    then:
      - script.execute: dexcom_read

interval:
  # Polls every minute: a new reading shows up at most 1 minute late.
  - interval: 60s
    startup_delay: 5s
    then:
      - script.execute: dexcom_read
