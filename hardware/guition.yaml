# Real hardware: Guition JC3248W535 (ESP32-S3, 3.5" 480x320 display, capacitive touch).
esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

# WiFi is not part of the firmware: it is chosen from the "Glucia" rescue network
# (captive portal) or over USB (improv_serial, from web.esphome.io).
# It is stored on the device and survives updates.
wifi:
  # If no WiFi is stored or it can't be found within 1 minute, it creates its own network
  ap:
    ssid: "Glucia"
    password: !secret ap_password

captive_portal:

improv_serial:

# Local web page (http://glucia.local) to change the Dexcom credentials and the brightness.
web_server:
  port: 80
  version: 3
  local: true

ota:
  # From the computer, on the same network: esphome run guition.yaml
  - platform: esphome
    password: !secret ota_password
  # From the internet: used by the automatic update (update: below)
  - platform: http_request

# If the new firmware hangs or reboots before running for 1 minute, the bootloader
# goes back to the previous one (ESP-IDF rollback, on by default with safe_mode).
# Only works if the bootloader was flashed over USB with this configuration.
safe_mode:

# Automatic updates: every 6 h it checks the manifest published by the GitHub Action
# and, if the version differs from the installed one, downloads it, checks the MD5 and installs it.
update:
  - platform: http_request
    id: firmware_update
    name: "Firmware"
    source: https://github.com/albarin/glucia/releases/latest/download/manifest.json
    update_interval: 6h
    on_update_available:
      # Local builds ("dev") don't update themselves: otherwise they would overwrite tests.
      - if:
          condition:
            lambda: return std::string(ESPHOME_PROJECT_VERSION) != "dev";
          then:
            - update.perform: firmware_update

time:
  - platform: sntp
    id: sys_time
    timezone: Europe/Madrid

http_request:
  timeout: 10s

# QSPI bus for the display
spi:
  id: display_bus
  type: quad
  clk_pin: GPIO47
  data_pins: [GPIO21, GPIO48, GPIO40, GPIO39]

display:
  - platform: mipi_spi
    model: JC3248W535
    id: screen
    auto_clear_enabled: false
    update_interval: never

# The display is portrait from the factory. This chip can't rotate in hardware,
# so LVGL rotates it (in software).
lvgl:
  rotation: 90

i2c:
  sda: GPIO4
  scl: GPIO8

touchscreen:
  - platform: axs15231
    display: screen

output:
  - platform: ledc
    pin: GPIO1
    id: backlight_pwm

light:
  - platform: monochromatic
    id: backlight
    name: "Brightness"
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON
