# Simulated hardware: a 480x320 window on your computer.
substitutions:
  headless: "false"   # true: no window (dev/screenshots.yaml)

host:

logger:

time:
  - platform: host
    id: sys_time

http_request:
  timeout: 10s
  # On Mac (Apple Silicon) it uses Homebrew's OpenSSL (/opt/homebrew/opt/openssl).
  # On Linux, uncomment the following line:
  # ca_certificate_path: /etc/ssl/certs/ca-certificates.crt

display:
  - platform: sdl
    id: screen
    auto_clear_enabled: false
    update_interval: never
    headless: ${headless}
    dimensions:
      width: 480
      height: 320

touchscreen:
  - platform: sdl

# No real backlight: a light that only logs, so the brightness setting works the same as on the board
output:
  - platform: template
    id: backlight_pwm
    type: float
    write_action:
      - lambda: ESP_LOGV("sim", "Brightness %.0f%%", state * 100);

light:
  - platform: monochromatic
    id: backlight
    name: "Brightness"
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON
